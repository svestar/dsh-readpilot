name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: node -e "const p = require('./package.json'); import('./index.js').then(m => { if (m.name !== p.name || typeof m.apply !== 'function') process.exit(1) }).catch(error => { console.error(error); process.exit(1) })"
      - run: pnpm test
      - run: git diff --exit-code
